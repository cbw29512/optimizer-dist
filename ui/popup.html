<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Stream Optimizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container" aria-labelledby="popupTitle">
    <img src="../assets/icon128.png" id="shieldIcon" alt="" aria-hidden="true">
    <h1 id="popupTitle">Web Stream Optimizer</h1>
    <div class="stats">
      <p>Time saved: <span id="timeSaved">0</span>s</p>
      <p id="siteStatus">Health: STABLE</p>
    </div>
    <button id="toggleBtn" type="button" aria-pressed="false">Loading…</button>
    <p id="statusMessage" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
